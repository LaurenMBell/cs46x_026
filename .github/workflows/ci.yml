# Made using blog tutorial: 
# URL: https://blog.saeloun.com/2022/09/21/expo-ci-cd/

name: CI
on: push 

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v2
     
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter & Tests
        run: |
          npm run lint
          npm run test 
